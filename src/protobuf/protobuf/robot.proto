syntax = "proto2";

package robot;

message LimitParameters
{
    // Used in Command Evaluator to limit velocities when used as 'acceleration'
    // Used for pathfinding when used as 'strategy'
    optional float a_speedup_f_max = 1;  // [m/s^2]
    optional float a_speedup_s_max = 2;  // [m/s^2]
    optional float a_speedup_phi_max = 3;  // [rad/s^2]
    optional float a_brake_f_max = 4;  // [m/s^2]
    optional float a_brake_s_max = 5;  // [m/s^2]
    optional float a_brake_phi_max = 6;  // [rad/s^2]
};

message SimulationLimits
{
    // Limits maximum acceleration per wheel in the simulator
    optional float a_speedup_wheel_max = 1;  // [rot/s^2]
    optional float a_brake_wheel_max = 2;  // [rot/s^2]
};

message Specs
{
    enum GenerationType
    {
        Regular = 1;  // used for the mixed team technical challenge: own robots
        // Ally = 2;  // used for the mixed team technical challenge: friendly robots from the other team
        reserved "Ally";
        reserved 2;
    }
    required uint32 generation = 1;
    required uint32 year = 2;
    required uint32 id = 3;
    optional GenerationType type = 19;
    optional float radius = 4 [default = 0.09];  // [m]
    optional float height = 5 [default = 0.15];  // [m]
    optional float mass = 6;  // [kg]
    optional float angle = 7;  // [rad]
    optional float v_max = 8;  // [m/s], used in pathfinding as reliably achievable robot velocity
    optional float omega_max = 9;  // [rad/s]
    optional float shot_linear_max = 10 [default = 8.0];  // [m/s], mainly used by strategy, should match rules (6.5 m/s)
    optional float shot_chip_max = 11;  // [m], mainly used by strategy, derived from 3D speed and launch angle
    optional float dribbler_width = 12;  // [m], actual width of the dribbler, maximum value depends on the value of the angle parameter
    optional LimitParameters acceleration = 13;
    optional LimitParameters strategy = 16;
    // deprecated = 14;
    optional float ir_param = 15;  // Sensitivity parameter for light barrier, only used in Gen2014 as GenPasta have fixed light barrier
    optional float shoot_radius = 17;  // [m], distance between the robot center and the edge of the ball when the ball is in the dribbler
    optional float dribbler_height = 18;  // [m]
    reserved 20;
    // if not present, the 'acceleration' field is used instread (with an additional acceleration factor)
    optional SimulationLimits simulation_limits = 21;
    optional bool can_shoot = 22 [default = true];
    optional bool can_dribble = 23 [default = true];
};

message Generation
{
    required Specs default = 1;
    repeated Specs robot = 2;
};

message Team
{
    repeated Specs robot = 1;
};

message Polynomial
{
    // Here, a0, a1, a2 and a3 do NOT represent position, velocity, acceleration and jerk
    // and instead are the raw polynomial coefficients:
    //    a0 + a1*t + a2*t^2 + a3*t^3 == x + v*t + (1/2)*a*t^2 + (1/6)*j*t^3
    // where x is the position, v the velocity, a the acceleration and j the jerk.
    // So it follows:
    //    a0 = x, a1 = v, a2 = a/2, a3 = j/6

    required float a0 = 1;
    required float a1 = 2;
    required float a2 = 3;
    required float a3 = 4;
}

message Spline
{
    required float t_start = 1;
    required float t_end = 2;
    required Polynomial x = 3;
    required Polynomial y = 4;
    required Polynomial phi = 5;
};

message Vector {
    required float x = 1;
    required float y = 2;
};

message AlphaTimeTrajectory {
    enum EndSpeedType
    {
        Exact = 1;
        Fast = 2;
    };
    optional Vector start_pos = 1;
    optional Vector start_vel = 2;
    optional Vector end_vel = 3;

    optional float start_angle = 4;
    optional float end_angle = 5;

    optional float alpha = 6;
    optional float time = 7;
    optional float acceleration = 8;
    optional float v_max = 9;
    optional EndSpeedType end_speed_type = 10;

    optional float slow_down_time = 11;
};

message ControllerInput
{
    // a parameterization of the robot position in the global xy-coordinate system
    // with the origin being the center of the field
    repeated Spline global_spline = 1;
    // a parameterization of the robot position in the global sf-coordinate system
    // with the origin being the position of the robot
    repeated Spline local_spline = 3;  // the x polynomial is for sideward direction, y polynomial for forward direction
    repeated AlphaTimeTrajectory trajectory = 2;
};

message SpeedVector
{
    optional float v_s = 1;
    optional float v_f = 2;
    optional float v_x = 4;
    optional float v_y = 5;
    optional float omega = 3;
};

message RobotState {
    optional float x = 1;
    optional float y = 2;
    optional float angle = 3;
};

message Command
{
    enum KickStyle
    {
        Linear = 1;
        Chip = 2;
    }

    optional ControllerInput controller = 1;
    // these fields are used for manual control; if local is false, v_[sf] actually contain v_[xy]
    optional float v_f = 2;
    optional float v_s = 3;
    optional float omega = 4;
    optional KickStyle kick_style = 5;
    optional float kick_power = 6;
    optional float dribbler = 7;
    optional bool local = 8;
    // deprecated = 9-10;
    optional bool standby = 11;
    // deprecated = 12
    optional bool strategy_controlled = 13;
    optional bool force_kick = 14;
    optional bool network_controlled = 15;
    optional bool eject_sdcard = 16;
    optional float cur_v_f = 17;
    optional float cur_v_s = 18;
    optional float cur_v_x = 23;
    optional float cur_v_y = 24;
    optional float cur_phi = 25;
    optional float cur_omega = 19;
    optional SpeedVector output0 = 20;
    optional SpeedVector output1 = 21;  // this field is used by the command converter for the SSL sim protocol
    optional SpeedVector output2 = 22;
    optional RobotState last_detection = 26;  // in [m] and [rad], in the global coordinate system
}

message RadioCommand
{
    required uint32 generation = 1;
    required uint32 id = 2;
    optional bool is_blue = 4;
    required Command command = 3;
    optional int64 command_time = 5;
};

message LocalSpeed
{
    required float v_f = 1;
    required float v_s = 2;
    required float omega = 3;
}

message ExtendedError
{
    required bool motor_1_error = 1;
    required bool motor_2_error = 2;
    required bool motor_3_error = 3;
    required bool motor_4_error = 4;
    required bool dribbler_error = 5;
    required bool kicker_error = 6;
    // optional bool motor_overheated_error = 8;
    optional bool kicker_break_beam_error = 11;
    optional bool motor_encoder_error = 9;
    optional bool main_sensor_error = 10;
    optional int32 temperature = 7;
}

message RadioResponse
{
    optional int64 time = 10;
    required uint32 generation = 1;
    required uint32 id = 2;
    optional float battery = 3;
    optional float packet_loss_rx = 4;
    optional float packet_loss_tx = 5;
    optional LocalSpeed estimated_speed = 6;
    optional bool ball_detected = 7;
    optional bool cap_charged = 8;
    optional bool error_present = 9;
    optional float radio_rtt = 11;
    optional ExtendedError extended_error = 12;
    optional bool is_blue = 13;
}
